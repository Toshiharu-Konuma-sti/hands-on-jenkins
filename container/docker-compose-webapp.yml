
x-image-cicd-webapp: &cicdWebappImage
  build:
    context: ./cicd
    target: webapp-node

services:

  webapp-webui:
    container_name: webapp-webui
    hostname: webapp-webui
    <<: *cicdWebappImage
    image: hands-on/jenkins/ubuntu/cicd/webapp-webui:latest
    ports:
      - 8181:8181
    networks:
      - internal
      - external
    restart: unless-stopped

  webapp-webapi:
    container_name: webapp-webapi
    hostname: webapp-webapi
    <<: *cicdWebappImage
    image: hands-on/jenkins/ubuntu/cicd/webapp-webapi:latest
    ports:
      - 8182:8182
    networks:
      - internal
      - external
    restart: unless-stopped

  webapp-mysql:
    hostname: webapp-mysql
    container_name: webapp-mysql
    image: mysql:8.4.8
    ports:
      - 3306:3306
    networks:
      - internal
      - external
    volumes:
      - ./mysql/config/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./mysql/init:/docker-entrypoint-initdb.d
    env_file:
      - .env-webapp-mysql
    command: mysqld
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
