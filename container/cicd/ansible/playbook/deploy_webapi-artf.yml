- name: Deploy WebAPI from Artifactory
  hosts: docker_containers
  become: yes

  vars_files:
    vars_common.yml

  vars:
    jar_base: "apisl.handson.rollingdice.webapp.webapi"
    jar_version: "0.0.1-SNAPSHOT"
    app_name: "webapp-webapi"

  tasks:
    - name: Debug environment variables for artifactory
      ansible.builtin.import_tasks: task_debug_for_artf.yml

    - name: Import the main task
      ansible.builtin.import_tasks: task_main.yml

    - name: Download a jar from Artifactory
      ansible.builtin.import_tasks: task_download_jar_from_artf.yml

    - name: Import a task to start webapp
      ansible.builtin.import_tasks: task_start_webapp.yml
